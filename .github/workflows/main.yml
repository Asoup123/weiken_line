
name: Deploy LINE Ordering Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build website
        run: npm run build
        env:
          VITE_APPWRITE_ENDPOINT: https://sgp.cloud.appwrite.io/v1
          VITE_APPWRITE_PROJECT_ID: 6aab96e3000fa724b62d
          VITE_APPWRITE_DATABASE_ID: line_order
          VITE_APPWRITE_CATEGORIES_COLLECTION_ID: categories
          VITE_APPWRITE_PRODUCTS_COLLECTION_ID: products
          VITE_APPWRITE_ORDERS_COLLECTION_ID: orders
          VITE_APPWRITE_ADMIN_API_FUNCTION_ID: 6afeb4e3002551ebd6b2
          VITE_APPWRITE_CREATE_ORDER_FUNCTION_ID: 6afeb48000348402a79a

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
